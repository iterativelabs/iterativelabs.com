<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IterativeLabs</title>
<meta name="description" content="IterativeLabs LLC, Raleigh, North Carolina.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231f2328'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23fff' font-family='Menlo,Consolas,monospace'>)(</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6e7781;
    --rule: #d1d9e0;
    --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --rule: #30363d;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wordmark {
    margin: 0;
    font-size: clamp(2.25rem, 8vw, 3.75rem);
    font-weight: 300;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .wordmark .glyph {
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 400;
    letter-spacing: -0.08em;
    margin-right: 0.12em;
  }
  hr {
    width: 48px;
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 28px auto;
  }
  address {
    font-style: normal;
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.8;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1 class="wordmark"><span class="glyph" aria-hidden="true">)(</span>IterativeLabs</h1>
  <hr>
  <address>
    IterativeLabs LLC<br>
    514 Daniels Street #412<br>
    Raleigh, NC 27607<br>
    <a href="tel:+19195904031">1.919.590.4031</a><br>
    <span id="email"><noscript>info at iterativelabs dot com</noscript></span>
  </address>
</main>
<footer>&copy; 2011&ndash;<span id="y">2026</span> IterativeLabs LLC</footer>
<script>
  (function () {
    var u = 'info', d = 'iterativelabs.com', a = document.createElement('a');
    a.href = 'mailto:' + u + '@' + d;
    a.textContent = u + '@' + d;
    document.getElementById('email').appendChild(a);
    document.getElementById('y').textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
